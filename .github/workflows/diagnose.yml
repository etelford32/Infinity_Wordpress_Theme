# Where did the theme actually go?
#
# The deploy succeeds — files transfer, caches flush — but the homepage
# does not serve the version that was just deployed. So the files are
# landing somewhere the site is not reading from, and the only way to
# know where is to ask the site and the server directly.
#
# Two SEPARATE jobs, deliberately. The first run of this put both in
# one job, the SSH half hung, and because GitHub only serves logs for
# a FINISHED job, the site half — which had already succeeded and holds
# the answer — was unreadable behind it. Split, a hung or refused SSH
# probe cannot take the useful half down with it.
#
# Purely read-only: it lists and greps, it never writes.
#
# Run from Actions -> Diagnose deploy target -> Run workflow.

name: Diagnose deploy target

on:
  workflow_dispatch:
    inputs:
      install:
        description: "WP Engine install name"
        required: false
        default: etelford
        type: string

jobs:
  site:
    name: Ask the live site
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: "https://elliottelford.com"
    steps:
      - name: Which theme does the homepage load?
        run: |
          set -uo pipefail
          code=$(curl -sS --max-time 30 -o page.html -w '%{http_code}' \
                   -A 'deploy-diagnostics' "$SITE_URL" || echo 000)
          echo "HTTP $code, $(wc -c < page.html 2>/dev/null || echo 0) bytes"

          echo ""
          echo "=== THEME DIRECTORIES IN THE HTML (this is the answer) ==="
          grep -o 'wp-content/themes/[A-Za-z0-9_.-]*' page.html | sort -u | tee themes-seen.txt
          [ -s themes-seen.txt ] || echo "(none — assets may be concatenated by an optimisation plugin)"

          echo ""
          echo "=== every ?ver= on the page ==="
          grep -o 'ver=[0-9][0-9A-Za-z._-]*' page.html | sort | uniq -c | sort -rn | head -15

          echo ""
          echo "=== markers from the new header ==="
          for marker in 'header-cta' 'nav-item-icon' 'bh-armed' 'fp-blackhole' 'sticky-header'; do
            printf '  %-16s %s hit(s)\n' "$marker" "$(grep -c "$marker" page.html)"
          done

          {
            echo "## What the live site loads"
            echo ""
            echo "HTTP \`$code\`"
            echo ""
            echo "Theme directories in its asset URLs:"
            echo '```'
            cat themes-seen.txt 2>/dev/null || echo "(none found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  server:
    name: Ask the server
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # Never block the site answer on this half
    continue-on-error: true
    env:
      INSTALL: ${{ inputs.install || 'etelford' }}
    steps:
      - name: What is on disk?
        env:
          KEY: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          timeout 30 ssh-keyscan -H "$INSTALL.ssh.wpengine.net" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Measured, not guessed: the bare install name is what answered
          # (the earlier run only looked hung because GitHub serves no logs
          # for a job still in flight). wpe_gha+<install> is what the deploy
          # action rsyncs as, so keep it as the fallback. Every call is under
          # `timeout` so a wedged session ends the step, not the job.
          SSH_USER=""
          for u in "$INSTALL" "wpe_gha+$INSTALL"; do
            if timeout 30 ssh -i ~/.ssh/id_ed25519 \
                 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                 -o ConnectTimeout=15 \
                 "$u@$INSTALL.ssh.wpengine.net" "echo ok" 2>/dev/null | grep -q ok; then
              SSH_USER="$u"
              break
            fi
            echo "ssh user '$u' did not answer"
          done
          if [ -z "$SSH_USER" ]; then
            echo "::warning::No SSH user authenticated; the site job above holds the answer."
            exit 0
          fi
          echo "connected as $SSH_USER"
          run() {
            timeout 45 ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
              "$SSH_USER@$INSTALL.ssh.wpengine.net" "cd sites/$INSTALL && $1" 2>&1
            local rc=$?
            [ $rc -eq 124 ] && echo "(timed out)"
            return 0
          }

          echo "=== wp-content/themes ==="
          run "ls -la wp-content/themes/" | tee themes-ls.txt

          echo ""
          echo "=== which theme WordPress considers active ==="
          run "wp theme list --skip-plugins --skip-themes" | tee theme-list.txt

          echo ""
          echo "=== what version is in the ACTIVE theme's directory? ==="
          run "s=\$(wp option get stylesheet --skip-plugins --skip-themes); echo \"active dir: \$s\"; grep -i '^Version' wp-content/themes/\$s/style.css 2>&1; ls -la wp-content/themes/\$s/assets/img/parkers-physics-logo.png 2>&1"

          {
            echo ""
            echo "## What is on the server"
            echo ""
            echo '```'
            cat themes-ls.txt
            echo '```'
            echo ""
            echo '```'
            cat theme-list.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
