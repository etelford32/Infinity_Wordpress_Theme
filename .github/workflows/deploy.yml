# Deploy the theme to WP Engine on every merge to the default branch.
#
# Three stages, in order, each gating the next:
#
#   validate  syntax and version checks. A PHP parse error rsynced onto a
#             live WordPress install is a white screen for every visitor,
#             and rsync will happily ship one — so nothing reaches the
#             server until the tree parses.
#   deploy    rsync over SSH, then purge WP Engine's cache.
#   verify    fetch the live site and prove the new version is actually
#             being served, so a deploy that quietly changed nothing
#             cannot report success.
#
# ---------------------------------------------------------------------
# One-time setup (in this order):
#   1. Generate a deploy key:
#        ssh-keygen -t ed25519 -f wpe_deploy -N "" -C "github-deploy"
#   2. WP Engine portal -> your profile -> SSH Keys -> add the PUBLIC key
#      (contents of wpe_deploy.pub). Keys take a few minutes to
#      propagate to the servers.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret, name WPE_SSHG_KEY_PRIVATE, value = the
#      PRIVATE key (contents of wpe_deploy, including the BEGIN/END
#      lines).
#
# The deploy target is NOT hardcoded. Before rsyncing, this asks the
# install which theme WordPress is actually running and deploys into
# that directory. That is deliberate: the first working deploy shipped
# every file correctly into wp-content/themes/infinity/ while the site
# ran wp-content/themes/Infinity_Wordpress_Theme-claude-wordpress-\
# threejs-theme-s3PrM/ — the folder name WordPress creates when you
# install a GitHub *branch* zip. Every stage reported success and the
# site did not change. A hardcoded path cannot notice that; asking the
# server cannot miss it.
#
# If step 2 is skipped or the keys do not match, every run fails with
# "Permission denied (publickey)" — the key is offered and refused. The
# fingerprint in the run log tells you which key was offered.
#
# Optional secrets:
#   CLOUDFLARE_API_TOKEN + CLOUDFLARE_ZONE_ID
#     Purges Cloudflare after deploy. Assets are versioned by
#     INFINITY_VERSION so they cache-bust on their own; this is for the
#     HTML, which is not versioned and which Cloudflare may be holding.
# ---------------------------------------------------------------------

name: Deploy theme to WP Engine

on:
  push:
    branches:
      - claude/wordpress-threejs-theme-s3PrM # default branch
  workflow_dispatch:
    inputs:
      environment:
        description: "WP Engine install name to deploy to"
        required: false
        default: etelford
        type: string
      theme_dir:
        description: "Theme folder to deploy into (blank = ask the site which theme is active)"
        required: false
        default: ""
        type: string

# One deploy at a time, and never cancel one midway: a half-finished
# rsync over a live theme directory is the worst possible outcome.
concurrency:
  group: wpe-deploy
  cancel-in-progress: false

env:
  SITE_URL: "https://elliottelford.com"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD^ is needed to see what this deploy actually changes
          fetch-depth: 2

      - name: Lint PHP
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './frontend/*' -not -path './.git/*')
          [ "$fail" -eq 0 ] || { echo "PHP did not parse — refusing to deploy"; exit 1; }
          echo "PHP OK"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          fail=0
          for f in assets/js/*.js; do
            if ! out=$(node --check "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "JS OK"

      - name: Check stylesheet is balanced
        run: |
          set -euo pipefail
          open=$(tr -cd '{' < style.css | wc -c)
          close=$(tr -cd '}' < style.css | wc -c)
          if [ "$open" -ne "$close" ]; then
            echo "::error file=style.css::Unbalanced braces: $open '{' vs $close '}'"
            exit 1
          fi
          echo "CSS OK ($open blocks)"

      - name: Check the theme version
        id: version
        run: |
          set -euo pipefail
          css=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -1 | tr -d '[:space:]')
          php=$(sed -n "s/.*define('INFINITY_VERSION',[[:space:]]*'\([^']*\)').*/\1/p" functions.php | head -1)

          if [ -z "$css" ] || [ -z "$php" ]; then
            echo "::error::Could not read the version from style.css ($css) or functions.php ($php)"
            exit 1
          fi

          # These two drive different things — the theme screen and the
          # asset query strings — and a mismatch means one of them is
          # lying about what is deployed.
          if [ "$css" != "$php" ]; then
            echo "::error::Version mismatch: style.css says $css, INFINITY_VERSION says $php"
            exit 1
          fi

          echo "version=$css" >> "$GITHUB_OUTPUT"
          echo "Version $css"

      - name: Warn if assets changed without a version bump
        run: |
          set -euo pipefail
          git rev-parse HEAD^ >/dev/null 2>&1 || { echo "No parent commit; skipping"; exit 0; }

          changed=$(git diff --name-only HEAD^ HEAD -- style.css assets/ | wc -l)
          [ "$changed" -gt 0 ] || { echo "No asset changes in this deploy"; exit 0; }

          now="${{ steps.version.outputs.version }}"
          was=$(git show HEAD^:style.css 2>/dev/null | sed -n 's/^Version:[[:space:]]*//p' | head -1 | tr -d '[:space:]')

          # Assets are enqueued with ?ver=INFINITY_VERSION, so an
          # unchanged version means returning visitors keep the copies
          # they already have and never see this deploy.
          if [ "$now" = "$was" ]; then
            echo "::warning::$changed asset file(s) changed but the version is still $now — returning visitors will keep their cached CSS/JS. Bump Version: in style.css and INFINITY_VERSION in functions.php."
            {
              echo "### Cache warning"
              echo ""
              echo "\`$changed\` asset file(s) changed while the version stayed at \`$now\`."
              echo "Returning visitors will keep their cached copies."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Version bumped $was -> $now"
          fi

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.target.outputs.slug }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy key is present
        env:
          KEY: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::WPE_SSHG_KEY_PRIVATE is not set. Add the PRIVATE half of the deploy key under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Deploy key present"

      - name: Ask WordPress which theme directory is live
        id: target
        env:
          KEY: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          INSTALL: ${{ inputs.environment || 'etelford' }}
          OVERRIDE: ${{ inputs.theme_dir }}
        run: |
          set -uo pipefail

          slug=""
          if [ -n "${OVERRIDE:-}" ]; then
            slug="$OVERRIDE"
            echo "Using the directory given on this run: $slug"
          else
            mkdir -p ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "$INSTALL.ssh.wpengine.net" >> ~/.ssh/known_hosts 2>/dev/null

            # The gateway takes the install name for interactive commands
            # and a wpe_gha+ variant for the deploy action's rsync. Which
            # one answers depends on how the key was registered, so ask
            # both rather than assume, and bound every attempt: a wedged
            # SSH session must not hold the deploy open for six hours.
            for u in "$INSTALL" "wpe_gha+$INSTALL"; do
              slug=$(timeout 90 ssh -i ~/.ssh/id_ed25519 \
                       -o StrictHostKeyChecking=accept-new \
                       -o BatchMode=yes -o ConnectTimeout=15 \
                       "$u@$INSTALL.ssh.wpengine.net" \
                       "cd sites/$INSTALL && wp option get stylesheet --skip-plugins --skip-themes" \
                       2>/dev/null | tr -d '\r' | tail -1)
              [ -n "$slug" ] && { echo "WordPress answered over SSH as '$u'"; break; }
              echo "ssh user '$u' gave no answer"
            done
          fi

          if [ -z "$slug" ]; then
            echo "::error::Could not ask the install which theme is active, so there is no safe directory to deploy into. Re-run this workflow and set 'theme_dir' to the folder name under wp-content/themes/ (Appearance -> Themes, or SFTP)."
            exit 1
          fi

          # This string becomes a remote path. Anything that is not a
          # plain directory name is a bug or a trap, not a theme.
          case "$slug" in
            "" | .* | *[!A-Za-z0-9._-]*)
              echo "::error::Refusing to deploy into an implausible theme directory: '$slug'"
              exit 1 ;;
          esac

          echo "path=wp-content/themes/$slug/" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Deploying into wp-content/themes/$slug/"

          # Cross-check against the site itself. get_stylesheet() is what
          # builds the asset URLs, so if the homepage names a different
          # directory something is in front of it — say so rather than
          # deploy quietly into the wrong place again.
          curl -sS --max-time 30 -o page.html -A 'deploy-target-check' "$SITE_URL" || true
          seen=$(grep -o 'wp-content/themes/[A-Za-z0-9_.-]*' page.html 2>/dev/null | sort -u | head -1)
          if [ -n "$seen" ] && [ "$seen" != "wp-content/themes/$slug" ]; then
            echo "::warning::WordPress reports '$slug' but the homepage loads assets from '$seen'. Deploying to '$slug'."
          fi

          {
            echo "### Deploying into \`wp-content/themes/$slug/\`"
            echo ""
            if [ "$slug" != "infinity" ]; then
              echo "That is the folder WordPress currently has active — not \`infinity\`."
              echo "It is the name WordPress gives a theme installed from a GitHub branch zip."
              echo "The site will pick this deploy up regardless; renaming is optional tidying."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # An asset optimiser that concatenates or de-versions the theme's
      # CSS is invisible from the outside and changes what "deployed"
      # means, so record which one is in play next to the deploy that
      # has to live with it. Informational only — never fail on it.
      - name: Which plugins touch assets or caching?
        continue-on-error: true
        env:
          INSTALL: ${{ inputs.environment || 'etelford' }}
        run: |
          set +e
          timeout 90 ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$INSTALL@$INSTALL.ssh.wpengine.net" \
            "cd sites/$INSTALL && wp plugin list --status=active --field=name --skip-plugins --skip-themes" \
            2>/dev/null | tr -d '\r' | tee plugins.txt
          echo ""
          echo "--- ones known to rewrite or cache assets ---"
          grep -iE 'cache|optimi[sz]|minif|rocket|autoptimize|litespeed|speed|cdn|performance|hummingbird|breeze|swift|velocity' plugins.txt \
            || echo "  (none matched by name)"

      - name: Deploy to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ inputs.environment || 'etelford' }}
          REMOTE_PATH: ${{ steps.target.outputs.path }}
          FLAGS: -azvr --inc-recursive --exclude='.git*' --exclude='node_modules' --exclude='tools' --exclude='frontend'
          CACHE_CLEAR: TRUE

      - name: Explain a failed deploy
        if: failure()
        run: |
          {
            echo "### Deploy failed"
            echo ""
            echo "If the log ends in \`Permission denied (publickey)\`, the key in"
            echo "\`WPE_SSHG_KEY_PRIVATE\` was offered and WP Engine refused it — the"
            echo "matching PUBLIC key is not registered on the account, or is not"
            echo "attached to this install."
            echo ""
            echo "Fix: WP Engine portal → profile → SSH Keys → add the public key"
            echo "whose fingerprint the log prints. Keys take a few minutes to"
            echo "propagate; re-run this workflow afterwards."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    # Job level, not step level: a step's `if` is evaluated before that
    # step's own env exists, so a secret declared beside the step it
    # guards would always read as empty and the step would never run.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      # Ask the webserver for the exact file that was just written. This
      # goes nowhere near WordPress, so it separates the two failures that
      # look identical from the outside: files that never arrived, and
      # files that arrived behind a cache still serving yesterday's HTML.
      # Fetch the stylesheet twice, and the difference names the culprit.
      # The plain URL is what a real browser asks for and what a CDN has
      # cached; the unique URL is a guaranteed miss, so it reads what is
      # on disk. Equal means the deploy is fully live. Different means
      # the file is live but something in front is still handing visitors
      # the old one — the case that looks like "the deploy did nothing".
      - name: Is the deployed stylesheet reaching visitors?
        id: asset
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SLUG: ${{ needs.deploy.outputs.slug }}
        run: |
          set +e
          base="$SITE_URL/wp-content/themes/$SLUG/style.css"

          codeA=$(curl -sS --max-time 30 -D plain.hdr -o plain.css -w '%{http_code}' "$base")
          plain=$(sed -n 's/^Version:[[:space:]]*//p' plain.css | head -1 | tr -d '[:space:]')
          codeB=$(curl -sS --max-time 30 -D bust.hdr -o bust.css -w '%{http_code}' "$base?cb=$GITHUB_RUN_ID")
          bust=$(sed -n 's/^Version:[[:space:]]*//p' bust.css | head -1 | tr -d '[:space:]')

          echo "plain URL      HTTP $codeA   Version: ${plain:-none}"
          grep -iE '^(cf-cache-status|x-cache|age|cache-control):' plain.hdr | sed 's/^/    /'
          echo "cache-busted   HTTP $codeB   Version: ${bust:-none}      expected: $VERSION"
          grep -iE '^(cf-cache-status|x-cache|age|cache-control):' bust.hdr | sed 's/^/    /'

          [ "$bust" = "$VERSION" ] && echo "live=yes" >> "$GITHUB_OUTPUT" || echo "live=no" >> "$GITHUB_OUTPUT"
          [ "$plain" = "$VERSION" ] && echo "reaching=yes" >> "$GITHUB_OUTPUT" || echo "reaching=no" >> "$GITHUB_OUTPUT"
          echo "served=${bust:-none}" >> "$GITHUB_OUTPUT"
          echo "plain=${plain:-none}" >> "$GITHUB_OUTPUT"

      # A page cache serves the same stale HTML to every anonymous
      # visitor, including this check. Fetching with a unique query
      # string is a different cache key, so a difference between the two
      # is the cache — and no difference rules it out.
      - name: Cached homepage vs uncached homepage
        id: page
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set +e
          # Retry the plain fetch: WP Engine's purge is not instant.
          for attempt in 1 2 3 4 5 6; do
            curl -sS --max-time 30 -D cached.hdr -o cached.html -A 'deploy-verify' "$SITE_URL"
            grep -q "ver=$VERSION" cached.html && break
            [ "$attempt" = 6 ] || sleep 20
          done
          curl -sS --max-time 30 -D fresh.hdr -o fresh.html -A 'deploy-verify' "$SITE_URL/?cb=$GITHUB_RUN_ID"

          for f in cached fresh; do
            echo ""
            echo "=== $f ==="
            grep -iE '^(x-cache|cf-cache-status|age|cache-control|x-wpe|server):' "$f.hdr" | sed 's/^/  /'
            # Markup this theme emits and nothing else does. A minifier can
            # rewrite asset URLs; it does not rename HTML classes.
            for m in header-cta nav-item-icon sticky-header bh-armed fp-blackhole; do
              printf '  %-16s %s hit(s)\n' "$m" "$(grep -c "$m" "$f.html")"
            done
            echo "  ver= values: $(grep -o 'ver=[0-9A-Za-z._-]*' "$f.html" | sort -u | tr '\n' ' ')"
          done

          # The enqueue calls all pass INFINITY_VERSION, so every theme
          # asset should carry ?ver=<version>. Printing the URLs as the
          # page actually contains them shows whether something stripped
          # the query string or bundled the files, instead of leaving it
          # to be inferred from an absence.
          echo ""
          echo "=== theme asset URLs as the page contains them ==="
          grep -o "[^\"']*wp-content/themes/[^\"']*" fresh.html | sort -u | head -20

          # A missing file makes grep print nothing, and an empty string
          # is not an integer — guard so the verdict step still runs.
          cached_hits=$(grep -c 'header-cta' cached.html 2>/dev/null)
          fresh_hits=$(grep -c 'header-cta' fresh.html 2>/dev/null)
          echo "cached_hits=${cached_hits:-0}" >> "$GITHUB_OUTPUT"
          echo "fresh_hits=${fresh_hits:-0}" >> "$GITHUB_OUTPUT"

      - name: Verdict
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SLUG: ${{ needs.deploy.outputs.slug }}
          ASSET_LIVE: ${{ steps.asset.outputs.live }}
          REACHING: ${{ steps.asset.outputs.reaching }}
          SERVED: ${{ steps.asset.outputs.served }}
          PLAIN: ${{ steps.asset.outputs.plain }}
          CACHED: ${{ steps.page.outputs.cached_hits }}
          FRESH: ${{ steps.page.outputs.fresh_hits }}
        run: |
          set +e
          CACHED="${CACHED:-0}"
          FRESH="${FRESH:-0}"
          {
            echo "## Verify"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| target | \`wp-content/themes/$SLUG/\` |"
            echo "| stylesheet, cache-busted URL | \`$SERVED\` (expected \`$VERSION\`) |"
            echo "| stylesheet, plain URL a browser asks for | \`$PLAIN\` |"
            echo "| new markup, normal request | $CACHED hit(s) |"
            echo "| new markup, cache-busted request | $FRESH hit(s) |"
            echo ""
            if [ "$ASSET_LIVE" = "yes" ] && [ "$REACHING" = "no" ]; then
              echo "**Deployed, but visitors get the old stylesheet.** A cache-busted URL"
              echo "returns \`$VERSION\`, so the file is live on disk — but the plain URL a"
              echo "browser actually requests returns \`$PLAIN\`. Something in front of the"
              echo "site is serving the previous copy under the same URL, which is why new"
              echo "markup can appear against old styling and the page looks broken rather"
              echo "than unchanged."
              echo ""
              echo "The theme enqueues every asset with \`INFINITY_VERSION\`, so this cannot"
              echo "be fixed by bumping the version — the query string is not reaching the"
              echo "URL. Purge the CDN. Adding \`CLOUDFLARE_API_TOKEN\` and"
              echo "\`CLOUDFLARE_ZONE_ID\` as repository secrets makes this workflow do it"
              echo "on every deploy."
            elif [ "$ASSET_LIVE" = "yes" ] && [ "$CACHED" -gt 0 ]; then
              echo "**Live.** \`$VERSION\` is on disk, reaching visitors, and rendering."
            elif [ "$ASSET_LIVE" = "yes" ] && [ "$FRESH" -gt 0 ]; then
              echo "**Deployed, HTML is cached.** The theme files are live — a cache-busted"
              echo "request renders the new markup, a normal one does not. Purge the page"
              echo "cache in front of the site (WP Engine portal, or Cloudflare if it fronts"
              echo "this domain). Add \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ZONE_ID\` as"
              echo "repository secrets and this workflow will purge it automatically."
            elif [ "$ASSET_LIVE" = "yes" ]; then
              echo "**Deployed, but not rendering.** \`$VERSION\` is on disk and served,"
              echo "yet neither request shows the new markup. That points at the homepage"
              echo "not being built by this theme's templates — a page builder, a cached"
              echo "object/fragment store, or a static-HTML plugin serving the front page."
            else
              echo "**Not live.** The webserver returns \`$SERVED\` for the stylesheet in"
              echo "\`$SLUG\`, not \`$VERSION\`, so the deployed file is not the one being"
              echo "read. Check whether a child theme or a second install directory is in play."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ASSET_LIVE" = "yes" ] && [ "$REACHING" = "yes" ] && [ "$CACHED" -gt 0 ]; then
            echo "Live and rendering $VERSION"
          else
            echo "::warning::$VERSION deployed to $SLUG; stylesheet plain='$PLAIN' busted='$SERVED', markup hits cached=$CACHED fresh=$FRESH. See the run summary."
          fi

      - name: Purge Cloudflare
        if: env.CF_TOKEN != '' && env.CF_ZONE != ''
        run: |
          set -euo pipefail
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee cf.json
          grep -q '"success":true' cf.json && echo "Cloudflare purged"
